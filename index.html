<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviveAI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            min-height: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>ReviveAI</h1>
    <p>AI-powered project assistant</p>
</header>

<div class="container">
    <h2>Ask ReviveAI</h2>

    <textarea id="message" placeholder="Enter your message..."></textarea>

    <button onclick="sendMessage()">Send</button>

    <div id="result">
        Your response will appear here.
    </div>
</div>

<script>
    async function sendMessage() {
        const message = document.getElementById("message").value;
        const result = document.getElementById("result");

        if (!message.trim()) {
            result.innerText = "Please enter a message.";
            return;
        }

        result.innerText = "Processing...";

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            const data = await response.json();

            result.innerText = data.response || data.message || "No response received.";

        } catch (error) {
            result.innerText = "Unable to connect to the server.";
        }
    }
</script>

</body>
</html>
